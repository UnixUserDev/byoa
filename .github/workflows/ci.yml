name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Best effort: the sandbox tests skip when a namespace genuinely cannot be created, which is
      # common on hosted runners. Nothing here is allowed to fail the job on its own.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap || true

      - name: Typecheck and test
        run: npm test

      - name: Smoke test
        run: npm run smoke
