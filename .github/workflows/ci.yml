name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Best effort: the sandbox tests skip when a namespace genuinely cannot be created, which is
      # common on hosted runners. Nothing here is allowed to fail the job on its own.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap || true

      - name: Typecheck and test
        run: npm test

      - name: Smoke test
        run: npm run smoke

      # Building the artifact here catches version drift and packaging breakage before a release,
      # and the version check is the one that used to slip through.
      - name: Build release artifacts
        run: npm run pack:release

      - name: Check the artifact's version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$(./dist/release/byoa --version)" = "$VERSION"
